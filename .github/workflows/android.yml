name: Android build
on:
  push:
    branches: [main]
    paths: ["android/**", "index.html", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: Copy web app into assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html logo.svg android/app/src/main/assets/www/
      - name: Build release bundle
        id: build
        continue-on-error: true
        run: |
          VC=$(git rev-list --count HEAD)
          gradle -p android bundleRelease -Pvc=$VC -Pvn=1.0.$VC --stacktrace > build.log 2>&1
      - name: Publish to android-build branch
        if: always()
        run: |
          mkdir out && cp build.log out/ || true
          cp android/app/build/outputs/bundle/release/*.aab out/ 2>/dev/null || true
          echo "${{ steps.build.outcome }} $(git rev-parse --short HEAD)" > out/STATUS
          cd out && git init -q -b android-build && git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" android-build
